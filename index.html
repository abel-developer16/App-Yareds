<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yared's Plan Manager</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }

        /* Progress SVG circle smooth transition */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Micro-animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastBounce {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            60% {
                transform: translateY(4px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-card {
            animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-toast {
            animation: toastBounce 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-header {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 selection:bg-brand-500 selection:text-white">

    <!-- App Main Container -->
    <div id="app" class="min-h-full flex flex-col max-w-md mx-auto relative pb-28 shadow-2xl bg-white dark:bg-slate-900 border-x border-slate-200/60 dark:border-slate-800/80">
        
        <!-- Sticky App Header Bar -->
        <header class="p-5 pb-3 sticky top-0 z-20 bg-white/85 dark:bg-slate-900/85 glass-header border-b border-slate-100 dark:border-slate-800/80 transition-colors">
            <div class="flex items-center justify-between mb-3.5">
                <div class="flex items-center space-x-2.5">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-500 to-indigo-600 flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-brand-500/25">
                        Y
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-slate-900 via-slate-800 to-brand-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">Yared's Plans</span>
                        <span class="block text-[10px] font-semibold tracking-wider uppercase text-slate-400 dark:text-slate-500">Personal Productivity</span>
                    </div>
                </div>

                <!-- Header Actions (Light/Dark Toggle & In-App Notification Center) -->
                <div class="flex items-center space-x-1.5">
                    <!-- Notification Bell Drawer Toggle -->
                    <button id="notif-center-btn" onclick="toggleNotifDrawer()" class="p-2.5 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all relative" title="In-App Alerts">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                        <span id="notif-badge" class="hidden absolute top-2 right-2 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>
                    </button>

                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle" onclick="toggleTheme()" class="p-2.5 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all" title="Toggle Theme">
                        <i data-lucide="moon" id="theme-icon-dark" class="w-4 h-4 hidden"></i>
                        <i data-lucide="sun" id="theme-icon-light" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Warm Greeting Banner & Daily Progress Ring -->
            <div class="bg-gradient-to-br from-slate-50 to-brand-50/40 dark:from-slate-800/60 dark:to-slate-800/20 p-4 rounded-3xl border border-slate-200/70 dark:border-slate-700/50 flex items-center justify-between shadow-xs">
                <div>
                    <h1 id="greeting-text" class="text-base font-bold tracking-tight text-slate-900 dark:text-white">Good morning, Yared ☀️</h1>
                    <p id="today-summary" class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Loading today's schedule...</p>
                    
                    <!-- Quick Summary Badges -->
                    <div class="flex items-center space-x-2 mt-2.5">
                        <span id="stat-overdue" class="hidden px-2 py-0.5 rounded-lg text-[10px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-200 dark:border-rose-800/50">
                            0 Overdue
                        </span>
                        <span id="stat-pending" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-brand-50 text-brand-700 dark:bg-brand-950/60 dark:text-brand-300 border border-brand-100 dark:border-brand-800/40">
                            0 Pending
                        </span>
                    </div>
                </div>

                <!-- SVG Progress Ring -->
                <div class="relative flex items-center justify-center w-16 h-16 flex-shrink-0 ml-2">
                    <svg class="w-16 h-16" viewBox="0 0 36 36">
                        <path class="text-slate-200 dark:text-slate-700/60" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="progress-ring" class="progress-ring-circle text-brand-500 stroke-current" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="100, 100" stroke-dashoffset="100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <span id="progress-text" class="absolute text-xs font-extrabold text-slate-800 dark:text-slate-100">0%</span>
                </div>
            </div>

            <!-- Group Navigation Tabs -->
            <div class="mt-3 space-y-2">
                <nav class="flex space-x-1 p-1 bg-slate-100 dark:bg-slate-800/70 rounded-2xl border border-slate-200/50 dark:border-slate-800">
                    <button onclick="switchTab('today')" id="tab-today" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5">
                        <span>Today</span>
                        <span id="badge-today" class="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">0</span>
                    </button>
                    <button onclick="switchTab('upcoming')" id="tab-upcoming" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5">
                        <span>Upcoming</span>
                        <span id="badge-upcoming" class="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">0</span>
                    </button>
                    <button onclick="switchTab('done')" id="tab-done" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5">
                        <span>Done</span>
                        <span id="badge-done" class="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">0</span>
                    </button>
                </nav>

                <!-- Search & Filters -->
                <div class="flex items-center space-x-2 pt-1">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" oninput="render()" placeholder="Search plans..." class="w-full pl-8 pr-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-slate-100 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                    </div>
                    <select id="category-filter" onchange="render()" class="py-1.5 px-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                        <option value="all">All Tags</option>
                        <option value="Work">💼 Work</option>
                        <option value="Personal">👤 Personal</option>
                        <option value="Health">🧘 Health</option>
                        <option value="Finance">💳 Finance</option>
                        <option value="Learning">📚 Learning</option>
                        <option value="Other">🏷️ Other</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Floating In-App Notifications Toast Container -->
        <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-sm px-4 z-50 pointer-events-none space-y-2">
            <!-- Dynamic toasts will render here -->
        </div>

        <!-- Main Task List Area -->
        <main class="flex-1 p-5 pt-3 overflow-y-auto">
            <div id="task-list" class="space-y-3">
                <!-- Rendered dynamically -->
            </div>

            <!-- Empty State Display -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 mb-4 rounded-3xl bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center text-slate-400 dark:text-slate-500">
                    <i data-lucide="sparkles" class="w-8 h-8"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-200" id="empty-title">All caught up!</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-[220px]" id="empty-desc">No plans scheduled in this section. Tap '+' below to add one!</p>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button onclick="openPlanModal()" class="fixed bottom-6 right-1/2 translate-x-[165px] sm:translate-x-[175px] w-14 h-14 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white rounded-2xl shadow-xl shadow-brand-500/35 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-brand-500/20 active:scale-95 transition-all z-30">
            <i data-lucide="plus" class="w-7 h-7 stroke-[2.5]"></i>
        </button>

        <!-- In-App Notification Center Drawer -->
        <div id="notif-drawer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-start justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-5 shadow-2xl border border-slate-100 dark:border-slate-800 transform -translate-y-6 transition-transform duration-300 max-h-[80vh] flex flex-col">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="bell-ring" class="w-4 h-4 text-brand-500"></i>
                        <h3 class="text-base font-bold text-slate-900 dark:text-white">Alerts & Notifications</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="clearAllInAppAlerts()" class="text-[11px] font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">Clear all</button>
                        <button onclick="toggleNotifDrawer()" class="p-1 rounded-full text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Alert History List -->
                <div id="notif-history-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Modal: Add / Edit Plan -->
        <div id="plan-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-800 transform translate-y-8 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
                    <h3 id="modal-title" class="text-base font-bold text-slate-900 dark:text-white">Add New Plan</h3>
                    <button onclick="closePlanModal()" class="p-1.5 rounded-full text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <form id="plan-form" onsubmit="handleSavePlan(event)" class="space-y-4">
                    <input type="hidden" id="plan-id">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Plan Title</label>
                        <input type="text" id="plan-input-title" required placeholder="e.g. Design review with team..." class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Date</label>
                            <input type="date" id="plan-input-date" required class="w-full px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Time</label>
                            <input type="time" id="plan-input-time" required class="w-full px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Category</label>
                            <select id="plan-input-category" class="w-full px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                                <option value="Work">💼 Work</option>
                                <option value="Personal">👤 Personal</option>
                                <option value="Health">🧘 Health</option>
                                <option value="Finance">💳 Finance</option>
                                <option value="Learning">📚 Learning</option>
                                <option value="Other">🏷️ Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Priority</label>
                            <select id="plan-input-priority" class="w-full px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                                <option value="Low">🟢 Low</option>
                                <option value="Medium" selected>🟡 Medium</option>
                                <option value="High">🔴 High</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Notes (Optional)</label>
                        <textarea id="plan-input-notes" rows="2" placeholder="Add extra details or reminders..." class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-slate-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all resize-none"></textarea>
                    </div>

                    <div class="pt-2 flex space-x-3">
                        <button type="button" onclick="closePlanModal()" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-2xl transition-colors">
                            Cancel
                        </button>
                        <button type="submit" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-2xl shadow-lg shadow-brand-500/20 active:scale-[0.98] transition-all">
                            Save Plan
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Application Script Logic -->
    <script>
        const STORAGE_KEY = 'yared_plans_v4';
        const NOTIF_LOG_KEY = 'yared_notif_log_v4';
        const THEME_KEY = 'yared_theme_pref';

        let plans = [];
        let inAppAlerts = [];
        let currentTab = 'today';
        let triggeredNotifIds = new Set();

        const CATEGORY_ICONS = {
            Work: '💼',
            Personal: '👤',
            Health: '🧘',
            Finance: '💳',
            Learning: '📚',
            Other: '🏷️'
        };

        const PRIORITY_BADGES = {
            Low: { bg: 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800/40', label: 'Low' },
            Medium: { bg: 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800/40', label: 'Medium' },
            High: { bg: 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800/40', label: 'High' }
        };

        window.onload = function() {
            loadTheme();
            loadPlans();
            loadInAppAlerts();
            setupLucide();
            switchTab('today');
            
            // In-app alert continuous check loop
            setInterval(inAppNotificationCheck, 3000);
            inAppNotificationCheck();
        };

        function setupLucide() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // --- Local Storage Management ---
        function loadPlans() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                // Clean empty state with no mock/seed data on first launch
                plans = saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("Failed to load plans", e);
                plans = [];
            }
        }

        function savePlans() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
            } catch (e) {
                console.error("Failed to save plans", e);
            }
            render();
        }

        function loadInAppAlerts() {
            try {
                const saved = localStorage.getItem(NOTIF_LOG_KEY);
                inAppAlerts = saved ? JSON.parse(saved) : [];
                inAppAlerts.forEach(a => triggeredNotifIds.add(a.triggerKey));
            } catch (e) {
                inAppAlerts = [];
            }
            updateNotifDrawerUI();
        }

        function saveInAppAlerts() {
            try {
                localStorage.setItem(NOTIF_LOG_KEY, JSON.stringify(inAppAlerts));
            } catch (e) {
                console.error("Failed to save alerts log", e);
            }
            updateNotifDrawerUI();
        }

        // --- Theme Handler ---
        function loadTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon-dark').classList.remove('hidden');
                document.getElementById('theme-icon-light').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon-dark').classList.add('hidden');
                document.getElementById('theme-icon-light').classList.remove('hidden');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            document.getElementById('theme-icon-dark').classList.toggle('hidden', !isDark);
            document.getElementById('theme-icon-light').classList.toggle('hidden', isDark);
        }

        // --- Greeting & Ring Progress ---
        function updateGreeting() {
            const hour = new Date().getHours();
            let text = "Good evening, Yared 🌙";
            if (hour < 12) text = "Good morning, Yared ☀️";
            else if (hour < 18) text = "Good afternoon, Yared 🌤️";

            document.getElementById('greeting-text').innerText = text;

            const todayStr = getFormattedDate(new Date());
            const todayPlans = plans.filter(p => p.date === todayStr);
            const total = todayPlans.length;
            const completed = todayPlans.filter(p => p.completed).length;

            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            const circle = document.getElementById('progress-ring');
            const offset = 100 - (percent / 100) * 100;
            circle.style.strokeDashoffset = offset;

            document.getElementById('progress-text').innerText = `${percent}%`;

            const summaryEl = document.getElementById('today-summary');
            if (total === 0) {
                summaryEl.innerText = "No plans scheduled for today";
            } else if (completed === total) {
                summaryEl.innerText = "All today's plans completed! 🎉";
            } else {
                summaryEl.innerText = `${completed} of ${total} plans completed today`;
            }

            // Quick Stats
            const overdueCount = plans.filter(p => checkIsOverdue(p)).length;
            const pendingCount = plans.filter(p => !p.completed).length;

            const overdueBadge = document.getElementById('stat-overdue');
            if (overdueCount > 0) {
                overdueBadge.classList.remove('hidden');
                overdueBadge.innerText = `${overdueCount} Overdue`;
            } else {
                overdueBadge.classList.add('hidden');
            }

            document.getElementById('stat-pending').innerText = `${pendingCount} Pending`;
        }

        // --- Navigation & Filtering ---
        function switchTab(tab) {
            currentTab = tab;
            ['today', 'upcoming', 'done'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "tab-btn flex-1 py-2 text-xs font-bold rounded-xl bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-xs transition-all flex items-center justify-center space-x-1.5";
                } else {
                    btn.className = "tab-btn flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all flex items-center justify-center space-x-1.5";
                }
            });
            render();
        }

        function getFilteredPlans() {
            const todayStr = getFormattedDate(new Date());
            const searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase();
            const categoryFilter = document.getElementById('category-filter')?.value || 'all';

            // Strictly sorted by Date and Time
            const sorted = [...plans].sort((a, b) => {
                const dtA = new Date(`${a.date}T${a.time}`);
                const dtB = new Date(`${b.date}T${b.time}`);
                return dtA - dtB;
            });

            return sorted.filter(p => {
                // Tab filter
                if (currentTab === 'done' && !p.completed) return false;
                if (currentTab === 'today' && (p.completed || p.date !== todayStr)) return false;
                if (currentTab === 'upcoming' && (p.completed || p.date <= todayStr)) return false;

                // Category filter
                if (categoryFilter !== 'all' && p.category !== categoryFilter) return false;

                // Search query
                if (searchQuery) {
                    const titleMatch = p.title.toLowerCase().includes(searchQuery);
                    const notesMatch = (p.notes || '').toLowerCase().includes(searchQuery);
                    if (!titleMatch && !notesMatch) return false;
                }

                return true;
            });
        }

        // --- Render Task List UI ---
        function render() {
            updateGreeting();
            updateBadges();

            const filtered = getFilteredPlans();
            const listEl = document.getElementById('task-list');
            const emptyEl = document.getElementById('empty-state');

            listEl.innerHTML = '';

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                const titles = {
                    today: "No plans for today",
                    upcoming: "No upcoming plans",
                    done: "No completed plans"
                };
                document.getElementById('empty-title').innerText = titles[currentTab] || "No plans found";
            } else {
                emptyEl.classList.add('hidden');
                
                filtered.forEach(plan => {
                    const isOverdue = checkIsOverdue(plan);
                    const card = createPlanCard(plan, isOverdue);
                    listEl.appendChild(card);
                });
            }

            setupLucide();
        }

        function updateBadges() {
            const todayStr = getFormattedDate(new Date());
            const todayCount = plans.filter(p => !p.completed && p.date === todayStr).length;
            const upcomingCount = plans.filter(p => !p.completed && p.date > todayStr).length;
            const doneCount = plans.filter(p => p.completed).length;

            document.getElementById('badge-today').innerText = todayCount;
            document.getElementById('badge-upcoming').innerText = upcomingCount;
            document.getElementById('badge-done').innerText = doneCount;
        }

        function checkIsOverdue(plan) {
            if (plan.completed) return false;
            const planDateTime = new Date(`${plan.date}T${plan.time}`);
            return planDateTime < new Date();
        }

        function createPlanCard(plan, isOverdue) {
            const div = document.createElement('div');
            const categoryIcon = CATEGORY_ICONS[plan.category] || '🏷️';
            const priorityBadge = PRIORITY_BADGES[plan.priority] || PRIORITY_BADGES.Medium;

            div.className = `animate-card group relative p-4 rounded-3xl border transition-all duration-200 ${
                plan.completed 
                    ? 'bg-slate-50/60 dark:bg-slate-900/40 border-slate-200/50 dark:border-slate-800/50 opacity-75' 
                    : isOverdue 
                        ? 'bg-rose-50/40 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800/80 shadow-xs ring-1 ring-rose-300/50 dark:ring-rose-800/40' 
                        : 'bg-white dark:bg-slate-800/60 border-slate-200/70 dark:border-slate-700/60 shadow-xs hover:shadow-md'
            }`;

            const formattedTime = format12Hour(plan.time);
            const formattedDate = formatDisplayDate(plan.date);

            div.innerHTML = `
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-start space-x-3 min-w-0 flex-1">
                        <!-- Checkbox -->
                        <button onclick="toggleComplete('${plan.id}')" class="mt-0.5 flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${
                            plan.completed 
                                ? 'bg-emerald-500 border-emerald-500 text-white' 
                                : 'border-slate-300 dark:border-slate-600 hover:border-brand-500 text-transparent'
                        }">
                            <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
                        </button>
                        
                        <!-- Content -->
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <h4 class="text-sm font-bold text-slate-800 dark:text-slate-100 break-words ${plan.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                                    ${escapeHtml(plan.title)}
                                </h4>
                            </div>

                            ${plan.notes ? `
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">${escapeHtml(plan.notes)}</p>
                            ` : ''}
                            
                            <div class="flex flex-wrap items-center gap-1.5 mt-2.5 text-xs">
                                <!-- Category Tag -->
                                <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-100 dark:bg-slate-700/80 text-slate-700 dark:text-slate-300">
                                    ${categoryIcon} ${plan.category || 'General'}
                                </span>

                                <!-- Priority Tag -->
                                <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold border ${priorityBadge.bg}">
                                    ${priorityBadge.label}
                                </span>

                                <!-- Scheduled Time -->
                                <span class="flex items-center space-x-1 text-[11px] ${isOverdue ? 'text-rose-600 dark:text-rose-400 font-bold' : 'text-slate-500 dark:text-slate-400'}">
                                    <i data-lucide="clock" class="w-3 h-3"></i>
                                    <span>${formattedTime}</span>
                                </span>

                                <!-- Date -->
                                ${currentTab !== 'today' ? `
                                    <span class="flex items-center space-x-1 text-[11px] text-slate-400 dark:text-slate-500">
                                        <i data-lucide="calendar" class="w-3 h-3"></i>
                                        <span>${formattedDate}</span>
                                    </span>
                                ` : ''}

                                ${isOverdue ? `
                                    <span class="px-2 py-0.5 rounded-lg text-[10px] font-extrabold bg-rose-600 text-white shadow-xs">
                                        Overdue
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Card Actions -->
                    <div class="flex items-center space-x-1 opacity-90 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                        <button onclick="openPlanModal('${plan.id}')" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deletePlan('${plan.id}')" class="p-1.5 rounded-xl text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;

            return div;
        }

        // --- In-App Notifications Engine ---
        function inAppNotificationCheck() {
            const now = new Date();
            const nowTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const todayStr = getFormattedDate(now);

            plans.forEach(plan => {
                if (!plan.completed && plan.date === todayStr && plan.time === nowTimeStr) {
                    const triggerKey = `${plan.id}_${todayStr}_${nowTimeStr}`;
                    if (!triggeredNotifIds.has(triggerKey)) {
                        triggeredNotifIds.add(triggerKey);
                        triggerInAppToast(plan, triggerKey);
                    }
                }
            });
        }

        function triggerInAppToast(plan, triggerKey) {
            playNotificationSound();

            // Store in alert history
            const newAlert = {
                id: 'alert-' + Date.now(),
                planId: plan.id,
                title: plan.title,
                time: plan.time,
                category: plan.category,
                read: false,
                timestamp: Date.now(),
                triggerKey: triggerKey
            };
            inAppAlerts.unshift(newAlert);
            saveInAppAlerts();

            // Render Toast Alert
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.id = `toast-${newAlert.id}`;
            toast.className = "animate-toast pointer-events-auto bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 p-4 rounded-2xl shadow-2xl border border-slate-700/50 dark:border-slate-200/50 flex flex-col space-y-2.5 backdrop-blur-md";

            toast.innerHTML = `
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center space-x-2.5 min-w-0">
                        <div class="w-8 h-8 rounded-xl bg-brand-500 text-white flex items-center justify-center flex-shrink-0 font-bold">
                            🔔
                        </div>
                        <div class="min-w-0">
                            <div class="text-[10px] font-bold text-brand-300 dark:text-brand-600 uppercase tracking-wider">Plan Due Now</div>
                            <h4 class="text-xs font-bold truncate">${escapeHtml(plan.title)}</h4>
                        </div>
                    </div>
                    <button onclick="dismissToast('${newAlert.id}')" class="text-slate-400 hover:text-white dark:hover:text-slate-900 p-1">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="flex items-center space-x-2 pt-1 border-t border-slate-800 dark:border-slate-200/60">
                    <button onclick="handleToastComplete('${plan.id}', '${newAlert.id}')" class="flex-1 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-bold rounded-xl transition-all flex items-center justify-center space-x-1">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        <span>Mark Done</span>
                    </button>
                    <button onclick="handleToastSnooze('${plan.id}', '${newAlert.id}')" class="px-3 py-1.5 bg-slate-800 dark:bg-slate-200 hover:bg-slate-700 dark:hover:bg-slate-300 text-slate-200 dark:text-slate-800 text-[11px] font-bold rounded-xl transition-all">
                        Snooze 5m
                    </button>
                </div>
            `;

            toastContainer.appendChild(toast);
            setupLucide();

            // Auto dismiss toast after 10 seconds if unhandled
            setTimeout(() => {
                dismissToast(newAlert.id);
            }, 10000);
        }

        function dismissToast(alertId) {
            const toast = document.getElementById(`toast-${alertId}`);
            if (toast) {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.2s ease-out';
                setTimeout(() => toast.remove(), 200);
            }
        }

        function handleToastComplete(planId, alertId) {
            toggleComplete(planId);
            dismissToast(alertId);
        }

        function handleToastSnooze(planId, alertId) {
            const plan = plans.find(p => p.id === planId);
            if (plan) {
                const [h, m] = plan.time.split(':').map(Number);
                const d = new Date();
                d.setHours(h);
                d.setMinutes(m + 5);
                plan.time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                savePlans();
            }
            dismissToast(alertId);
        }

        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                // Audio Context fallback if blocked
            }
        }

        // --- Notification Drawer UI ---
        function toggleNotifDrawer() {
            const drawer = document.getElementById('notif-drawer');
            const isHidden = drawer.classList.contains('opacity-0');

            if (isHidden) {
                drawer.classList.remove('opacity-0', 'pointer-events-none');
                drawer.querySelector('div').classList.remove('-translate-y-6');
                // Mark all as read
                inAppAlerts.forEach(a => a.read = true);
                saveInAppAlerts();
            } else {
                drawer.querySelector('div').classList.add('-translate-y-6');
                drawer.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function updateNotifDrawerUI() {
            const badge = document.getElementById('notif-badge');
            const unreadCount = inAppAlerts.filter(a => !a.read).length;

            if (unreadCount > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const historyList = document.getElementById('notif-history-list');
            if (!historyList) return;

            historyList.innerHTML = '';

            if (inAppAlerts.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-8 text-slate-400 dark:text-slate-500 text-xs">
                        No alert history yet.
                    </div>
                `;
                return;
            }

            inAppAlerts.forEach(alert => {
                const item = document.createElement('div');
                item.className = "p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs";
                item.innerHTML = `
                    <div class="min-w-0 flex-1 pr-2">
                        <div class="font-bold text-slate-800 dark:text-slate-100 truncate">${escapeHtml(alert.title)}</div>
                        <div class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">Scheduled time: ${format12Hour(alert.time)}</div>
                    </div>
                    <span class="px-2 py-0.5 text-[9px] font-bold rounded-lg bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300">
                        Triggered
                    </span>
                `;
                historyList.appendChild(item);
            });
        }

        function clearAllInAppAlerts() {
            inAppAlerts = [];
            saveInAppAlerts();
        }

        // --- Core CRUD Handlers ---
        function toggleComplete(id) {
            const plan = plans.find(p => p.id === id);
            if (plan) {
                plan.completed = !plan.completed;
                plan.completedAt = plan.completed ? Date.now() : null;
                
                // Trigger celebratory confetti if completing all today tasks
                if (plan.completed && window.confetti) {
                    const todayStr = getFormattedDate(new Date());
                    const todayPlans = plans.filter(p => p.date === todayStr);
                    const allDone = todayPlans.every(p => p.completed);

                    if (allDone && todayPlans.length > 0) {
                        confetti({
                            particleCount: 80,
                            spread: 70,
                            origin: { y: 0.7 }
                        });
                    }
                }
                savePlans();
            }
        }

        function deletePlan(id) {
            plans = plans.filter(p => p.id !== id);
            savePlans();
        }

        function openPlanModal(editId = null) {
            const modal = document.getElementById('plan-modal');
            const titleInput = document.getElementById('plan-input-title');
            const dateInput = document.getElementById('plan-input-date');
            const timeInput = document.getElementById('plan-input-time');
            const categoryInput = document.getElementById('plan-input-category');
            const priorityInput = document.getElementById('plan-input-priority');
            const notesInput = document.getElementById('plan-input-notes');
            const idInput = document.getElementById('plan-id');
            const modalTitle = document.getElementById('modal-title');

            if (editId) {
                const plan = plans.find(p => p.id === editId);
                if (plan) {
                    idInput.value = plan.id;
                    titleInput.value = plan.title;
                    dateInput.value = plan.date;
                    timeInput.value = plan.time;
                    categoryInput.value = plan.category || 'Work';
                    priorityInput.value = plan.priority || 'Medium';
                    notesInput.value = plan.notes || '';
                    modalTitle.innerText = "Edit Plan";
                }
            } else {
                idInput.value = '';
                titleInput.value = '';
                dateInput.value = getFormattedDate(new Date());
                
                const now = new Date();
                now.setHours(now.getHours() + 1);
                timeInput.value = `${String(now.getHours()).padStart(2, '0')}:00`;
                categoryInput.value = 'Work';
                priorityInput.value = 'Medium';
                notesInput.value = '';
                modalTitle.innerText = "Add New Plan";
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            const inner = modal.querySelector('div');
            inner.classList.remove('translate-y-8');
            setTimeout(() => titleInput.focus(), 100);
        }

        function closePlanModal() {
            const modal = document.getElementById('plan-modal');
            const inner = modal.querySelector('div');
            inner.classList.add('translate-y-8');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function handleSavePlan(e) {
            e.preventDefault();
            const id = document.getElementById('plan-id').value;
            const title = document.getElementById('plan-input-title').value.trim();
            const date = document.getElementById('plan-input-date').value;
            const time = document.getElementById('plan-input-time').value;
            const category = document.getElementById('plan-input-category').value;
            const priority = document.getElementById('plan-input-priority').value;
            const notes = document.getElementById('plan-input-notes').value.trim();

            if (!title || !date || !time) return;

            if (id) {
                const plan = plans.find(p => p.id === id);
                if (plan) {
                    plan.title = title;
                    plan.date = date;
                    plan.time = time;
                    plan.category = category;
                    plan.priority = priority;
                    plan.notes = notes;
                }
            } else {
                const newPlan = {
                    id: 'plan-' + Date.now(),
                    title,
                    date,
                    time,
                    category,
                    priority,
                    notes,
                    completed: false,
                    createdAt: Date.now()
                };
                plans.push(newPlan);
                
                const todayStr = getFormattedDate(new Date());
                if (date === todayStr) switchTab('today');
                else if (date > todayStr) switchTab('upcoming');
            }

            savePlans();
            closePlanModal();
        }

        // --- Helper Date & Text Formatting ---
        function getFormattedDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function format12Hour(time24) {
            if (!time24) return '';
            const [h, m] = time24.split(':');
            let hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${hours}:${m} ${ampm}`;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
